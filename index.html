<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI - Akıllı Asistan</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c0c0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            --glass: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
            --accent: linear-gradient(45deg, #00d4ff, #ff00ff);
            --accent-glow: #00d4ff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255,255,255,0.7);
        }

        [data-theme="light"] {
            --bg-primary: linear-gradient(135deg, #f0f2f5 0%, #e9ecef 100%);
            --glass: rgba(0,0,0,0.05);
            --glass-border: rgba(0,0,0,0.1);
            --accent: linear-gradient(45deg, #007bff, #6610f2);
            --accent-glow: #007bff;
            --text-primary: #212529;
            --text-secondary: rgba(33,37,41,0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .header {
            padding: 15px 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: var(--accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: rgba(0,255,136,0.2);
            color: #00ff88;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        .theme-toggle, .settings-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--glass);
            color: var(--text-secondary);
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover, .settings-btn:hover {
            background: var(--glass-border);
            transform: scale(1.05);
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 120px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .chat-container::-webkit-scrollbar {
            display: none;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 24px;
            position: relative;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
        }

        .jarvis {
            align-self: flex-start;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            max-width: 85%;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-glow);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-container {
            padding: 20px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .input-field {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 30px;
            background: var(--glass);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }

        .send-btn {
            background: var(--accent);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.1) rotate(10deg);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voice-btn {
            background: var(--glass);
            color: var(--accent-glow);
            font-size: 20px;
        }

        .voice-btn.recording {
            background: radial-gradient(circle, #ff4444, #cc0000);
            box-shadow: 0 0 30px rgba(255,68,68,0.6);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255,68,68,0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255,68,68,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
        }

        .clear-btn {
            background: var(--glass);
            color: var(--text-secondary);
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .header { padding: 12px 16px; }
            .chat-container { padding: 16px; padding-bottom: 140px; }
            .input-container { padding: 16px; }
            .message { max-width: 92%; }
            .clear-btn { right: 140px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">🤖 JARVIS</div>
            <div class="status" id="status">Aktif</div>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Tema Değiştir">🌙</button>
            <button class="settings-btn" id="settingsBtn" title="Ayarlar">⚙️</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-container">
        <button class="btn clear-btn" id="clearBtn" title="Temizle">🗑️</button>
        <input type="text" class="input-field" id="messageInput" placeholder="Jarvis'e sor..." />
        <button class="btn voice-btn" id="voiceBtn" title="Sesli Sor">🎤</button>
        <button class="btn send-btn" id="sendBtn" disabled>➤</button>
    </div>

    <script>
        class JarvisAI {
            constructor() {
                this.chatContainer = document.getElementById('chatContainer');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.voiceBtn = document.getElementById('voiceBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.status = document.getElementById('status');
                this.themeToggle = document.getElementById('themeToggle');
                this.settingsBtn = document.getElementById('settingsBtn');
                
                this.isTyping = false;
                this.conversationHistory = [];
                this.isRecording = false;
                this.recognition = null;
                
                this.init();
            }

            init() {
                // Event Listeners
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.messageInput.addEventListener('input', () => {
                    this.sendBtn.disabled = !this.messageInput.value.trim();
                });
                this.voiceBtn.addEventListener('click', () => this.toggleVoice());
                this.clearBtn.addEventListener('click', () => this.clearChat());
                this.themeToggle.addEventListener('click', () => this.toggleTheme());
                this.settingsBtn.addEventListener('click', () => this.showSettings());

                // Welcome message
                this.addMessage("Merhaba! Ben Jarvis, senin kişisel AI asistanınım. Her türlü soruya cevap verebilirim 🚀", 'jarvis');

                // Speech Recognition
                if ('webkitSpeechRecognition' in window) {
                    this.recognition = new webkitSpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.lang = 'tr-TR';
                    this.recognition.onresult = (event) => this.onSpeechResult(event);
                    this.recognition.onerror = () => this.stopVoice();
                }

                // PWA
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js');
                }
            }

            async sendMessage() {
                const text = this.messageInput.value.trim();
                if (!text || this.isTyping) return;

                this.addMessage(text, 'user');
                this.messageInput.value = '';
                this.sendBtn.disabled = true;
                this.setTyping(true);

                try {
                    const response = await this.getAIResponse(text);
                    this.setTyping(false);
                    this.addMessage(response, 'jarvis');
                } catch (error) {
                    this.setTyping(false);
                    this.addMessage("Üzgünüm, bir hata oluştu. Lütfen tekrar deneyin.", 'jarvis');
                }
            }

async getAIResponse(message) {
    const API_KEY = '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'; // 👈 BURAYA!
    
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${API_KEY}`
            },
            body: JSON.stringify({
                model: 'gpt-3.5-turbo',
                messages: [{role: "user", content: message}],
                max_tokens: 500
            })
        });
        
        if (response.ok) {
            const data = await response.json();
            return data.choices[0].message.content;
        }
        throw new Error();
    } catch {
        return this.getUltraSmartResponse(message); // Fallback
    }
}

            smartFallback(message) {
                const responses = {
                    'hava': 'Hava durumu için konumunuzu paylaşın, hemen bakayım! 🌤️',
                    'saat': `Şu an ${new Date().toLocaleTimeString('tr-TR')}`,
                    'tarih': `Bugün ${new Date().toLocaleDateString('tr-TR')}`,
                    'nasılsın': 'Harikayım! Size nasıl yardımcı olabilirim? 😊',
                    'teşekkür': 'Rica ederim! Başka ne yapabilirim? 🙌',
                    'default': 'Bu konuda yardımcı olmak isterim. Daha spesifik sorabilir misiniz? 🤔'
                };

                const lowerMsg = message.toLowerCase();
                for (let key in responses) {
                    if (lowerMsg.includes(key)) {
                        return responses[key];
                    }
                }
                return responses.default;
            }

            addMessage(text, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const time = new Date().toLocaleTimeString('tr-TR', { 
                    hour: '2-digit', 
                    minute: '2-digit' 
                });
                
                messageDiv.innerHTML = `
                    ${text}
                    <div class="message-time">${sender === 'user' ? 'Siz' : 'Jarvis'} • ${time}</div>
                `;
                
                this.chatContainer.appendChild(messageDiv);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            setTyping(typing) {
                this.isTyping = typing;
                const existing = this.chatContainer.querySelector('.typing-indicator');
                
                if (typing && !existing) {
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'typing-indicator';
                    typingDiv.innerHTML = `
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <span style="margin-left: 12px; font-size: 14px; opacity: 0.7;">Yazıyor...</span>
                    `;
                    this.chatContainer.appendChild(typingDiv);
                    this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
                } else if (!typing && existing) {
                    existing.remove();
                }
            }

            toggleVoice() {
                if (this.isRecording) {
                    this.stopVoice();
                } else {
                    this.startVoice();
                }
            }

            startVoice() {
                if (!this.recognition) {
                    this.addMessage('Ses tanıma tarayıcınızda desteklenmiyor.', 'jarvis');
                    return;
                }

                this.isRecording = true;
                this.voiceBtn.classList.add('recording');
                this.status.textContent = 'Dinliyor...';
                this.recognition.start();
            }

            stopVoice() {
                this.isRecording = false;
                this.voiceBtn.classList.remove('recording');
                this.status.textContent = 'Aktif';
                if (this.recognition) {
                    this.recognition.stop();
                }
            }

            onSpeechResult(event) {
                const transcript = event.results[0][0].transcript;
                this.messageInput.value = transcript;
                this.stopVoice();
                this.sendMessage();
            }

            clearChat() {
                this.chatContainer.innerHTML = '';
                this.conversationHistory = [];
                this.addMessage("Sohbet temizlendi. Yeni bir başlangıç! 🚀", 'jarvis');
            }

            toggleTheme() {
                const isDark = document.body.getAttribute('data-theme') !== 'light';
                document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
                this.themeToggle.textContent = isDark ? '☀️' : '🌙';
                localStorage.setItem('theme', isDark ? 'light' : 'dark');
            }

            showSettings() {
                alert('Ayarlar:\n• Tema: Otomatik/Açık/Koyu\n• API Key: Settings > API\n• Dil: Türkçe/English\n\nGitHub Pages için API key ekleyin!');
            }
        }

        // Initialize
        const jarvis = new JarvisAI();

        // Load theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').textContent = savedTheme === 'light' ? '☀️' : '🌙';

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            deferredPrompt = e;
        });
    </script>
</body>
  </html>
